<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Fluxo Cromático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Fluxo</h1>
        <small>Cromático</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>NÍVEL</span><b id="lvl">1</b></div>
      <div class="stat"><span>JOGADAS</span><b id="moves">0</b></div>
      <div class="stat"><span>TEMPO</span><b id="time">0:00</b></div>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="frame" id="frame">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div class="board" id="board"></div>
    </div>
  </section>

  <nav class="actions">
    <button id="btnLevels"><span>Níveis</span></button>
    <button id="btnHint"><span>Dica</span></button>
    <button id="btnShuffle"><span>Embaralhar</span></button>
    <button id="btnPreview"><span>Solução</span></button>
  </nav>
  <p class="tip">Toque em duas peças ou arraste uma sobre a outra para trocar. Peças com marcador estão travadas.</p>
</main>

<div class="modal" id="winModal" hidden>
  <div class="card">
    <small class="kicker">// SEQUÊNCIA COMPLETA</small>
    <h2>Degradê completo!</h2>
    <div class="stars" id="stars"></div>
    <p id="winInfo"></p>
    <div class="row">
      <button id="btnReplay"><span>Repetir</span></button>
      <button class="primary" id="btnNext"><span>Próximo nível</span></button>
    </div>
  </div>
</div>

<div class="modal" id="levelModal" hidden>
  <div class="card wide">
    <small class="kicker">// SELEÇÃO</small>
    <h2>Escolha o nível</h2>
    <div class="levels" id="levelGrid"></div>
    <div class="row"><button id="btnCloseLevels"><span>Fechar</span></button></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
